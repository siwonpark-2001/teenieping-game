<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>티니핑 도감</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--pink:#e05090;--pink2:#c03070;--purple:#9b59b6;--pink-light:#f0c0d8;--pink-bg:#fff0fb;}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:linear-gradient(160deg,#ffe8f5 0%,#f0e0ff 100%);min-height:100vh;display:flex;justify-content:center;}
.app{width:100%;max-width:480px;min-height:100vh;position:relative;background:linear-gradient(160deg,#ffe8f5 0%,#f0e0ff 100%);}

/* SCREENS */
.screen{display:none;flex-direction:column;min-height:100vh;}
.screen.active{display:flex;}

/* ── HOME ── */
.home-header{background:linear-gradient(135deg,#e05090,#9b59b6);color:white;text-align:center;padding:44px 20px 28px;border-radius:0 0 32px 32px;}
.home-header h1{font-size:1.9rem;font-weight:900;letter-spacing:-0.5px;}
.home-header p{font-size:.82rem;opacity:.8;margin-top:5px;}
.home-body{padding:18px 16px 24px;flex:1;display:flex;flex-direction:column;gap:14px;}

.daily-card{background:white;border-radius:22px;padding:22px 18px 18px;box-shadow:0 4px 20px rgba(224,80,144,.15);text-align:center;}
.daily-label{font-size:.72rem;font-weight:700;color:var(--pink);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;}
.daily-img-wrap{width:130px;height:130px;margin:0 auto 14px;border-radius:50%;background:#ffe8f5;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.daily-img-wrap img{width:110px;height:110px;object-fit:contain;transition:filter .3s;}
.daily-img-wrap img.silhouette{filter:brightness(0) opacity(.3);}
.daily-char-name{font-size:1.05rem;font-weight:700;color:#333;min-height:26px;margin-bottom:3px;}
.daily-char-season{font-size:.78rem;color:#aaa;margin-bottom:14px;min-height:18px;}
.played-badge{display:flex;align-items:center;gap:8px;background:#f8f8f8;border-radius:12px;padding:10px 14px;margin-bottom:12px;text-align:left;}
.played-badge-icon{font-size:1.3rem;flex-shrink:0;}
.played-badge-text{font-size:.82rem;color:#666;line-height:1.4;}
.played-badge-text strong{color:#333;}
.btn-primary{display:block;width:100%;padding:13px;background:linear-gradient(135deg,var(--pink),var(--purple));color:white;border:none;border-radius:14px;font-size:.97rem;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn-primary:active{opacity:.88;transform:scale(.98);}
.btn-primary:disabled{background:#ddd;color:#bbb;cursor:default;transform:none;opacity:1;}

.dex-card{background:white;border-radius:22px;padding:16px 18px;box-shadow:0 4px 20px rgba(224,80,144,.1);}
.dex-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.dex-card-title{font-size:.88rem;font-weight:700;color:#333;}
.dex-card-count{font-size:.88rem;font-weight:700;color:var(--pink);}
.prog-bg{height:8px;background:#f0e0f8;border-radius:4px;overflow:hidden;margin-bottom:12px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:4px;transition:width .6s ease;}
.btn-outline{display:block;width:100%;padding:11px;background:white;color:var(--pink);border:2px solid var(--pink-light);border-radius:14px;font-size:.88rem;font-weight:700;cursor:pointer;transition:background .15s;}
.btn-outline:hover{background:var(--pink-bg);}

/* ── GAME ── */
.top-bar{background:linear-gradient(135deg,#e05090,#9b59b6);color:white;padding:14px 16px;display:flex;align-items:center;gap:12px;border-radius:0 0 22px 22px;margin-bottom:18px;}
.btn-back{background:rgba(255,255,255,.22);border:none;color:white;border-radius:10px;width:34px;height:34px;font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.top-bar-text{flex:1;}
.top-bar-title{font-size:.92rem;font-weight:700;}
.top-bar-sub{font-size:.72rem;opacity:.8;}

.game-body{padding:0 16px 24px;}
.game-card{background:white;border-radius:22px;padding:22px 18px 18px;box-shadow:0 4px 20px rgba(224,80,144,.15);text-align:center;}
.season-badge{display:inline-block;background:linear-gradient(135deg,#ffe0f0,#f0e0ff);color:var(--pink);border-radius:20px;padding:3px 13px;font-size:.74rem;font-weight:700;margin-bottom:14px;}
.char-img-box{width:170px;height:170px;margin:0 auto 20px;background:#fff5fd;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.char-img-box img{max-width:100%;max-height:100%;object-fit:contain;}
/* 주관식 입력 */
.input-row{display:flex;gap:8px;margin-bottom:10px;}
.g-input{flex:1;border:2px solid var(--pink-light);border-radius:13px;padding:11px 14px;font-size:1rem;font-family:inherit;outline:none;transition:border-color .2s;color:#333;}
.g-input:focus{border-color:var(--pink);}
.g-input:disabled{background:#f5f5f5;color:#aaa;}
.btn-submit{background:linear-gradient(135deg,var(--pink),var(--purple));color:white;border:none;border-radius:13px;padding:11px 16px;font-size:.9rem;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.btn-submit:disabled{background:#ddd;cursor:default;}
.feedback{min-height:32px;display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:700;border-radius:10px;padding:6px 12px;margin-bottom:10px;}
.feedback.ok{background:#e8f5e9;color:#2e7d32;}
.feedback.ng{background:#fce4ec;color:#c62828;}
.hint-area{text-align:center;}
.btn-hint{background:none;border:none;color:#bbb;font-size:.8rem;cursor:pointer;text-decoration:underline;padding:4px;}
.hint-box{display:none;background:#fff8e1;border:1.5px solid #ffe082;border-radius:10px;padding:7px 14px;font-size:.83rem;color:#e65100;margin-top:7px;font-weight:700;}
.hint-box.show{display:block;}
.btn-skip{display:block;width:100%;margin-top:12px;padding:9px;background:none;border:1.5px solid #e0e0e0;border-radius:12px;color:#bbb;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .15s;}
.btn-skip:hover{border-color:var(--pink-light);color:var(--pink);}

/* ── RESULT ── */
.result-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:36px 16px 24px;text-align:center;}
.result-emoji{font-size:3.6rem;margin-bottom:10px;animation:pop .45s ease;}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.result-card{background:white;border-radius:22px;padding:22px 18px;width:100%;max-width:340px;box-shadow:0 4px 20px rgba(224,80,144,.15);margin-bottom:18px;}
.result-img{width:130px;height:130px;object-fit:contain;margin-bottom:12px;}
.result-name{font-size:1.35rem;font-weight:900;color:#333;margin-bottom:3px;}
.result-season{font-size:.78rem;color:#aaa;margin-bottom:12px;}
.result-msg{font-size:.88rem;font-weight:700;padding:8px 16px;border-radius:10px;}
.result-msg.ok{background:#e8f5e9;color:#2e7d32;}
.result-msg.ng{background:#fce4ec;color:#c62828;}
.result-btns{display:flex;flex-direction:column;gap:9px;width:100%;max-width:340px;}
.btn-dex-go{padding:13px;background:linear-gradient(135deg,var(--pink),var(--purple));color:white;border:none;border-radius:14px;font-size:.95rem;font-weight:700;cursor:pointer;}
.btn-home{padding:11px;background:white;color:var(--pink);border:2px solid var(--pink-light);border-radius:14px;font-size:.88rem;font-weight:700;cursor:pointer;}

/* ── DEX ── */
.dex-body{padding:0 14px 24px;flex:1;overflow-y:auto;}
.dex-tabs{display:flex;gap:6px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none;}
.dex-tabs::-webkit-scrollbar{display:none;}
.dex-tab{flex-shrink:0;padding:6px 13px;border:2px solid var(--pink-light);border-radius:20px;background:white;color:#aaa;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .15s;}
.dex-tab.active{background:linear-gradient(135deg,var(--pink),var(--purple));border-color:transparent;color:white;}
.dex-section{margin-bottom:8px;}
.dex-section-label{font-size:.75rem;font-weight:700;color:#bbb;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.dex-section-count{color:var(--pink);}
.dex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.dex-cell{background:white;border-radius:14px;padding:9px 5px 7px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.dex-cell.got{border:2px solid #fce4ec;}
.dex-cell.locked{border:2px solid #eee;opacity:.65;}
.dex-cell img{width:66px;height:66px;object-fit:contain;margin-bottom:4px;display:block;margin-left:auto;margin-right:auto;}
.dex-cell.locked img{filter:brightness(0) opacity(.35);}
.dex-cell-name{font-size:.68rem;font-weight:700;color:#555;line-height:1.3;word-break:keep-all;}
.dex-cell.locked .dex-cell-name{color:#ccc;}
.dex-sep{margin-bottom:16px;}

/* Season sections in 전체 tab */
.season-group{margin-bottom:20px;}
.season-group-title{font-size:.82rem;font-weight:700;color:#888;background:linear-gradient(135deg,#ffe8f5,#f0e0ff);border-radius:10px;padding:5px 12px;margin-bottom:8px;display:flex;justify-content:space-between;}
.season-group-count{color:var(--pink);}
</style>
</head>
<body>
<div class="app">

<!-- ════════ HOME ════════ -->
<div id="s-home" class="screen active">
  <div class="home-header">
    <h1>💕 티니핑 도감</h1>
    <p>매일 새로운 티니핑을 만나보세요</p>
  </div>
  <div class="home-body">
    <div class="daily-card">
      <div class="daily-label">🌟 오늘의 티니핑</div>
      <div class="daily-img-wrap"><img id="h-img" src="" alt=""></div>
      <div class="daily-char-name" id="h-name">???</div>
      <div class="daily-char-season" id="h-season"></div>
      <div id="h-played-area"></div>
      <button class="btn-primary" id="h-play-btn" onclick="startGame()">🎮 이름 맞추기 시작!</button>
    </div>

    <div class="dex-card">
      <div class="dex-card-top">
        <span class="dex-card-title">📖 내 티니핑 도감</span>
        <span class="dex-card-count" id="h-dex-count">0 / 164</span>
      </div>
      <div class="prog-bg"><div class="prog-fill" id="h-prog" style="width:0%"></div></div>
      <button class="btn-outline" onclick="showDex()">도감 보러가기 →</button>
    </div>
  </div>
</div>

<!-- ════════ GAME ════════ -->
<div id="s-game" class="screen">
  <div class="top-bar">
    <button class="btn-back" onclick="goHome()">←</button>
    <div class="top-bar-text">
      <div class="top-bar-title">오늘의 티니핑</div>
      <div class="top-bar-sub">이름을 맞춰보세요!</div>
    </div>
  </div>
  <div class="game-body">
    <div class="game-card">
      <div class="season-badge" id="g-badge"></div>
      <div class="char-img-box"><img id="g-img" src="" alt=""></div>
      <div class="input-row">
        <input class="g-input" id="g-input" type="text" inputmode="text"
          placeholder="티니핑 이름을 입력하세요"
          autocomplete="off" autocorrect="off" spellcheck="false"
          onkeydown="if(event.key==='Enter')checkAnswer()">
        <button class="btn-submit" id="g-submit" onclick="checkAnswer()">확인</button>
      </div>
      <div class="feedback" id="g-feedback"></div>
      <div class="hint-area">
        <button class="btn-hint" id="g-hint-btn" onclick="showHint()">💡 힌트 (첫 글자)</button>
        <div class="hint-box" id="g-hint-box"></div>
      </div>
      <button class="btn-skip" id="g-skip" onclick="giveUp()">모르겠어요 (포기)</button>
    </div>
  </div>
</div>

<!-- ════════ RESULT ════════ -->
<div id="s-result" class="screen">
  <div class="result-inner">
    <div class="result-emoji" id="r-emoji">🎉</div>
    <div class="result-card">
      <img class="result-img" id="r-img" src="" alt="">
      <div class="result-name" id="r-name"></div>
      <div class="result-season" id="r-season"></div>
      <div class="result-msg" id="r-msg"></div>
    </div>
    <div class="result-btns">
      <button class="btn-dex-go" onclick="startGame()">다음 티니핑! →</button>
      <button class="btn-home" onclick="showDex()">📖 도감 보기</button>
      <button class="btn-home" onclick="goHome()">메인으로 돌아가기</button>
    </div>
  </div>
</div>

<!-- ════════ DEX ════════ -->
<div id="s-dex" class="screen">
  <div class="top-bar">
    <button class="btn-back" onclick="goHome()">←</button>
    <div class="top-bar-text">
      <div class="top-bar-title">티니핑 도감</div>
      <div class="top-bar-sub" id="d-header-count"></div>
    </div>
  </div>
  <div class="dex-tabs" id="d-tabs"></div>
  <div class="dex-body" id="d-body"></div>
</div>

</div><!-- .app -->

/* ── STORAGE ── */
const K = { seed:'tp_seed', col:'tp_collected', daily:'tp_daily' };

function getSeed() {
  let s = localStorage.getItem(K.seed);
  if (!s) { s = String(Math.floor(Math.random()*99991)); localStorage.setItem(K.seed, s); }
  return parseInt(s);
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function getDailyState() {
  const today = todayKey();
  const raw = localStorage.getItem(K.daily);
  if (raw) {
    const st = JSON.parse(raw);
    if (st.date === today) return st;
  }
  const seed = getSeed();
  const dayNum = Math.floor(Date.now() / 86400000);
  const idx = (seed * 31 + dayNum * 7) % ALL_DATA.length;
  const st = { date: today, idx, played: false, correct: false };
  localStorage.setItem(K.daily, JSON.stringify(st));
  return st;
}

function saveDailyState(st) { localStorage.setItem(K.daily, JSON.stringify(st)); }

function getCollected() { return new Set(JSON.parse(localStorage.getItem(K.col)||'[]')); }
function addCollected(key) {
  const c = getCollected(); c.add(key);
  localStorage.setItem(K.col, JSON.stringify([...c]));
}
function entryKey(e) { return e.name + '__' + e.season; }

/* ── SCREEN SWITCH ── */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ── HOME ── */
function goHome() { show('s-home'); renderHome(); }

function renderHome() {
  const col = getCollected();

  // 항상 실루엣 + 시작 버튼 활성화 (테스트 모드)
  const img = document.getElementById('h-img');
  const previewEntry = ALL_DATA[Math.floor(Math.random() * ALL_DATA.length)];
  img.src = previewEntry.local;
  img.className = 'silhouette';
  document.getElementById('h-name').textContent = '???';
  document.getElementById('h-season').textContent = '이 티니핑의 이름을 맞춰보세요!';
  document.getElementById('h-played-area').innerHTML = '';
  document.getElementById('h-play-btn').textContent = '🎮 이름 맞추기 시작!';
  document.getElementById('h-play-btn').disabled = false;

  const total = ALL_DATA.length;
  const cnt = col.size;
  document.getElementById('h-dex-count').textContent = `${cnt} / ${total}`;
  document.getElementById('h-prog').style.width = `${(cnt/total)*100}%`;
}

/* ── GAME ── */
let hintUsed = false;
let currentEntry = null;

function pickRandom() {
  return ALL_DATA[Math.floor(Math.random() * ALL_DATA.length)];
}

function startGame(entry) {
  show('s-game');
  hintUsed = false;
  currentEntry = entry || pickRandom();

  document.getElementById('g-badge').textContent = seasonLabel(currentEntry.season);
  document.getElementById('g-img').src = currentEntry.local;
  document.getElementById('g-hint-box').classList.remove('show');
  document.getElementById('g-hint-btn').style.display = 'inline';
  document.getElementById('g-feedback').textContent = '';
  document.getElementById('g-feedback').className = 'feedback';
  document.getElementById('g-input').value = '';
  document.getElementById('g-input').disabled = false;
  document.getElementById('g-submit').disabled = false;
  document.getElementById('g-skip').disabled = false;
  setTimeout(() => document.getElementById('g-input').focus(), 300);
}

function checkAnswer() {
  const input = document.getElementById('g-input');
  const val = input.value.trim();
  if (!val) return;

  const isCorrect = val === currentEntry.name;
  const fb = document.getElementById('g-feedback');

  if (isCorrect) {
    fb.textContent = '🎉 정답!';
    fb.className = 'feedback ok';
    input.disabled = true;
    document.getElementById('g-submit').disabled = true;
    document.getElementById('g-skip').disabled = true;
    addCollected(entryKey(currentEntry));
    setTimeout(() => showResult(currentEntry, true), 800);
  } else {
    fb.textContent = '❌ 틀렸어요! 다시 시도해보세요.';
    fb.className = 'feedback ng';
    input.value = '';
    input.focus();
    input.style.animation = 'none';
    requestAnimationFrame(() => { input.style.animation = 'shake .35s ease'; });
  }
}

function giveUp() {
  document.getElementById('g-input').disabled = true;
  document.getElementById('g-submit').disabled = true;
  document.getElementById('g-skip').disabled = true;
  showResult(currentEntry, false);
}

function showHint() {
  hintUsed = true;
  document.getElementById('g-hint-box').textContent = `첫 글자: ${currentEntry.name[0]}`;
  document.getElementById('g-hint-box').classList.add('show');
  document.getElementById('g-hint-btn').style.display = 'none';
}

/* ── RESULT ── */
function showResult(entry, isCorrect) {
  show('s-result');
  document.getElementById('r-emoji').textContent = isCorrect ? '🎉' : '💔';
  document.getElementById('r-img').src = entry.local;
  document.getElementById('r-name').textContent = entry.name;
  document.getElementById('r-season').textContent = seasonLabel(entry.season);
  const msg = document.getElementById('r-msg');
  if (isCorrect) { msg.textContent = '도감에 추가됐어요! ✨'; msg.className = 'result-msg ok'; }
  else { msg.textContent = '정답을 확인하고 내일 다시 도전해봐요!'; msg.className = 'result-msg ng'; }
}

/* ── DEX ── */
const SEASON_TABS = ['전체','1기','2기','3기','4기','5기','6기','극장판'];
const SEASON_NAMES = {'1기':'큐브 티니핑','2기':'보석 티니핑','3기':'열쇠 티니핑','4기':'디저트 티니핑','5기':'스타 티니핑','6기':'프린세스 티니핑','극장판':'극장판'};
let curTab = '전체';

function seasonLabel(s) { return s.startsWith('극장판') ? '극장판' : s; }

function showDex() {
  show('s-dex');
  renderDex();
}

function renderDex() {
  const col = getCollected();
  document.getElementById('d-header-count').textContent = `${col.size} / ${ALL_DATA.length} 수집`;

  // Tabs
  const tabsEl = document.getElementById('d-tabs');
  tabsEl.innerHTML = '';
  SEASON_TABS.forEach(tab => {
    const btn = document.createElement('button');
    btn.className = 'dex-tab' + (tab === curTab ? ' active' : '');
    btn.textContent = tab;
    btn.onclick = () => { curTab = tab; renderDex(); };
    tabsEl.appendChild(btn);
  });

  const body = document.getElementById('d-body');
  body.innerHTML = '';

  if (curTab === '전체') {
    // Group by season
    ['1기','2기','3기','4기','5기','6기','극장판'].forEach(season => {
      const items = ALL_DATA.filter(e => seasonLabel(e.season) === season);
      const gotCount = items.filter(e => col.has(entryKey(e))).length;
      const grp = document.createElement('div');
      grp.className = 'season-group';
      const title = document.createElement('div');
      title.className = 'season-group-title';
      title.innerHTML = `<span>${season} ${SEASON_NAMES[season]?`(${SEASON_NAMES[season]})`:''}` +
        `</span><span class="season-group-count">${gotCount}/${items.length}</span>`;
      grp.appendChild(title);
      grp.appendChild(buildGrid(items, col));
      body.appendChild(grp);
    });
  } else {
    const items = ALL_DATA.filter(e => seasonLabel(e.season) === curTab);
    const gotCount = items.filter(e => col.has(entryKey(e))).length;
    const progWrap = document.createElement('div');
    progWrap.style.cssText = 'padding:0 2px 12px;';
    progWrap.innerHTML = `<div style="display:flex;justify-content:space-between;font-size:.75rem;color:#aaa;margin-bottom:5px;">
      <span>${curTab} 수집 현황</span><span style="color:var(--pink);font-weight:700">${gotCount}/${items.length}</span>
    </div>
    <div class="prog-bg"><div class="prog-fill" style="width:${items.length?(gotCount/items.length*100):0}%"></div></div>`;
    body.appendChild(progWrap);
    body.appendChild(buildGrid(items, col));
  }
}

function buildGrid(items, col) {
  const grid = document.createElement('div');
  grid.className = 'dex-grid';
  items.forEach(entry => {
    const got = col.has(entryKey(entry));
    const cell = document.createElement('div');
    cell.className = 'dex-cell ' + (got ? 'got' : 'locked');
    cell.innerHTML = `<img src="${entry.local}" alt="${got ? entry.name : '???'}">
      <div class="dex-cell-name">${got ? entry.name : '???'}</div>`;
    grid.appendChild(cell);
  });
  return grid;
}

/* ── INIT ── */
renderHome();
</script>
