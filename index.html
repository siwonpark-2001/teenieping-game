<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 티니핑 이름 맞추기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    background: linear-gradient(135deg, #ffe0f0, #fff0fb);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px;
  }
  h1 { color: #e05090; font-size: 2rem; margin-bottom: 4px; }
  .subtitle { color: #c060a0; font-size: 0.88rem; margin-bottom: 14px; }

  .controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
  .filter-btn {
    padding: 5px 13px; border: 2px solid #e070b0;
    border-radius: 20px; background: white; color: #e070b0;
    cursor: pointer; font-size: 0.82rem; font-weight: bold; transition: all .2s;
  }
  .filter-btn.active { background: #e070b0; color: white; }
  .filter-btn:hover { transform: scale(1.05); }

  .mode-toggle { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .mode-btn {
    padding: 4px 13px; border: 2px solid #e070b0; border-radius: 16px;
    background: white; color: #e070b0; cursor: pointer; font-size: .8rem; font-weight: bold;
  }
  .mode-btn.active { background: #e070b0; color: white; }

  .scoreboard { display: flex; gap: 20px; margin-bottom: 16px; }
  .score-box {
    text-align: center; background: white; border-radius: 14px;
    padding: 8px 18px; box-shadow: 0 2px 8px rgba(224,80,144,.15);
  }
  .score-label { font-size: .72rem; color: #aaa; }
  .score-val { font-size: 1.5rem; font-weight: bold; color: #e05090; }

  .card {
    background: white; border-radius: 22px;
    box-shadow: 0 4px 20px rgba(224,80,144,.2);
    padding: 24px; max-width: 420px; width: 100%; text-align: center;
  }
  .season-badge {
    display: inline-block; background: #ffe0f0; color: #e05090;
    border-radius: 10px; padding: 2px 11px;
    font-size: .76rem; font-weight: bold; margin-bottom: 12px;
  }
  .img-wrap {
    width: 200px; height: 200px; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    background: #fff8fd; border-radius: 16px;
  }
  .img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .progress { font-size: .8rem; color: #bbb; margin-bottom: 10px; }

  .input-row { display: flex; gap: 7px; margin-bottom: 8px; }
  input[type=text] {
    flex: 1; border: 2px solid #f0c0d8; border-radius: 11px;
    padding: 9px 12px; font-size: 1rem; outline: none; transition: border-color .2s;
  }
  input[type=text]:focus { border-color: #e070b0; }
  .btn-submit {
    background: #e070b0; color: white; border: none;
    border-radius: 11px; padding: 9px 16px; font-size: 1rem; font-weight: bold; cursor: pointer;
  }
  .btn-submit:hover { background: #c050a0; }

  .hint-btn { font-size: .8rem; color: #bbb; cursor: pointer; text-decoration: underline; margin-bottom: 8px; display: block; }

  /* 4지선다 */
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .choice-btn {
    background: white; border: 2px solid #f0c0d8; border-radius: 12px;
    padding: 10px; font-size: .92rem; cursor: pointer; transition: all .2s;
  }
  .choice-btn:hover { border-color: #e070b0; background: #fff0fb; }
  .choice-btn.correct-ans { border-color: #4caf50; background: #e8f5e9; color: #2e7d32; }
  .choice-btn.wrong-ans   { border-color: #e05090; background: #fce4ec; color: #c2185b; }

  .feedback { font-size: 1.05rem; font-weight: bold; min-height: 26px; margin-bottom: 10px; }
  .feedback.correct { color: #4caf50; }
  .feedback.wrong   { color: #e05090; }

  .btn-skip {
    background: none; border: 2px solid #ddd; color: #bbb;
    border-radius: 11px; padding: 7px 14px; font-size: .83rem; cursor: pointer; transition: all .2s;
  }
  .btn-skip:hover { border-color: #e070b0; color: #e070b0; }

  #result-screen { display: none; flex-direction: column; align-items: center; gap: 10px; }
  #result-screen.show { display: flex; }
  .result-emoji { font-size: 3rem; }
  .result-title { font-size: 1.4rem; font-weight: bold; color: #e05090; }
  .result-score { font-size: 1rem; color: #888; }
  .btn-restart {
    background: #e070b0; color: white; border: none; border-radius: 14px;
    padding: 11px 26px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 6px;
  }
  .game-area { width: 100%; max-width: 420px; }
</style>
</head>
<body>
<h1>💕 티니핑 이름 맞추기</h1>
<p class="subtitle">이미지를 보고 티니핑 이름을 맞춰보세요! (총 164마리)</p>

<div class="controls">
  <button class="filter-btn active" onclick="setFilter('all')">전체</button>
  <button class="filter-btn" onclick="setFilter('1기')">1기</button>
  <button class="filter-btn" onclick="setFilter('2기')">2기</button>
  <button class="filter-btn" onclick="setFilter('3기')">3기</button>
  <button class="filter-btn" onclick="setFilter('4기')">4기</button>
  <button class="filter-btn" onclick="setFilter('5기')">5기</button>
  <button class="filter-btn" onclick="setFilter('6기')">6기</button>
  <button class="filter-btn" onclick="setFilter('극장판')">극장판</button>
</div>

<div class="mode-toggle">
  <button class="mode-btn active" onclick="setMode('input')">✏️ 직접 입력</button>
  <button class="mode-btn" onclick="setMode('choice')">🔤 4지선다</button>
</div>

<div class="scoreboard">
  <div class="score-box"><div class="score-label">점수</div><div class="score-val" id="score">0</div></div>
  <div class="score-box"><div class="score-label">정답</div><div class="score-val" id="correct">0</div></div>
  <div class="score-box"><div class="score-label">오답</div><div class="score-val" id="wrong">0</div></div>
</div>

<div class="game-area">
  <div class="card" id="game-card">
    <div class="season-badge" id="season-badge">1기</div>
    <div class="img-wrap"><img id="char-img" src="" alt="티니핑"></div>
    <div class="progress" id="progress"></div>

    <div id="input-mode">
      <div class="input-row">
        <input type="text" id="answer-input" placeholder="이름 입력 (예: 하츄핑)"
          autocomplete="off" onkeydown="if(event.key==='Enter') checkAnswer()">
        <button class="btn-submit" onclick="checkAnswer()">확인</button>
      </div>
      <span class="hint-btn" onclick="showHint()" id="hint-btn">💡 힌트 (첫 글자)</span>
    </div>

    <div id="choice-mode" style="display:none">
      <div class="choices" id="choices"></div>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="btn-skip" onclick="skip()">건너뛰기</button>
  </div>

  <div id="result-screen">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <div class="result-title" id="result-title">완료!</div>
    <div class="result-score" id="result-score"></div>
    <button class="btn-restart" onclick="restart()">다시 하기</button>
  </div>
</div>

let pool=[], queue=[], current=null;
let currentFilter='all', currentMode='input';
let score=0, correctCount=0, wrongCount=0;
let hintUsed=false, answered=false;

function setFilter(f) {
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    const l=b.textContent.trim();
    b.classList.toggle('active',(f==='all'&&l==='전체')||(f==='극장판'&&l==='극장판')||l===f);
  });
  restart();
}
function setMode(m) {
  currentMode=m;
  document.querySelectorAll('.mode-btn').forEach(b =>
    b.classList.toggle('active', b.textContent.includes(m==='input'?'입력':'4지')));
  document.getElementById('input-mode').style.display  = m==='input'  ? '' : 'none';
  document.getElementById('choice-mode').style.display = m==='choice' ? '' : 'none';
  restart();
}
function shuffle(a) {
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function restart() {
  if(currentFilter==='all') pool=[...ALL_DATA];
  else if(currentFilter==='극장판') pool=ALL_DATA.filter(t=>t.season.startsWith('극장판'));
  else pool=ALL_DATA.filter(t=>t.season===currentFilter);
  queue=shuffle([...pool]);
  score=0; correctCount=0; wrongCount=0; updateScore();
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('game-card').style.display='';
  nextQuestion();
}
function nextQuestion() {
  answered=false; hintUsed=false;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('answer-input').value='';
  document.getElementById('answer-input').disabled=false;
  document.getElementById('hint-btn').textContent='💡 힌트 (첫 글자)';
  if(queue.length===0){showResult();return;}
  current=queue.pop();
  document.getElementById('char-img').src=current.local||current.src;
  document.getElementById('season-badge').textContent=current.season;
  document.getElementById('progress').textContent=(pool.length-queue.length)+' / '+pool.length;
  if(currentMode==='choice') buildChoices();
  else document.getElementById('answer-input').focus();
}
function buildChoices() {
  const others=shuffle(ALL_DATA.filter(t=>t.name!==current.name)).slice(0,3);
  const opts=shuffle([current,...others]);
  const box=document.getElementById('choices'); box.innerHTML='';
  opts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='choice-btn'; btn.textContent=o.name;
    btn.onclick=()=>selectChoice(o.name===current.name,btn);
    box.appendChild(btn);
  });
}
function selectChoice(isCorrect,btn) {
  if(answered) return; answered=true;
  const fb=document.getElementById('feedback');
  if(isCorrect){score+=10;correctCount++;btn.classList.add('correct-ans');fb.textContent='✅ 정답! +10점';fb.className='feedback correct';}
  else{wrongCount++;btn.classList.add('wrong-ans');document.querySelectorAll('.choice-btn').forEach(b=>{if(b.textContent===current.name)b.classList.add('correct-ans');});fb.textContent='❌ 틀렸어요! 정답: '+current.name;fb.className='feedback wrong';}
  updateScore(); setTimeout(nextQuestion,1600);
}
function checkAnswer() {
  if(answered){nextQuestion();return;}
  const input=document.getElementById('answer-input').value.trim();
  if(!input) return;
  const fb=document.getElementById('feedback');
  if(input===current.name){const pts=hintUsed?5:10;score+=pts;correctCount++;fb.textContent='✅ 정답! +'+pts+'점'+(hintUsed?' (힌트 사용)':'');fb.className='feedback correct';}
  else{wrongCount++;fb.textContent='❌ 틀렸어요! 정답: '+current.name;fb.className='feedback wrong';}
  answered=true; document.getElementById('answer-input').disabled=true;
  document.getElementById('answer-input').value=current.name;
  updateScore(); setTimeout(nextQuestion,1600);
}
function skip() {
  if(answered) return; wrongCount++;
  document.getElementById('feedback').textContent='⏭ 건너뜀! 정답: '+current.name;
  document.getElementById('feedback').className='feedback wrong';
  answered=true; updateScore(); setTimeout(nextQuestion,1600);
}
function showHint() {
  if(answered) return; hintUsed=true;
  const n=current.name;
  document.getElementById('hint-btn').textContent='힌트: '+n[0]+'_'.repeat(n.length-1);
}
function updateScore() {
  document.getElementById('score').textContent=score;
  document.getElementById('correct').textContent=correctCount;
  document.getElementById('wrong').textContent=wrongCount;
}
function showResult() {
  document.getElementById('game-card').style.display='none';
  document.getElementById('result-screen').classList.add('show');
  const pct=Math.round(correctCount/pool.length*100);
  document.getElementById('result-emoji').textContent=pct>=80?'🏆':pct>=50?'💕':'😅';
  document.getElementById('result-title').textContent=pct>=80?'티니핑 박사!':pct>=50?'잘했어요!':'더 연습해봐요!';
  document.getElementById('result-score').textContent='총 점수: '+score+'점  |  정답: '+correctCount+'/'+pool.length+' ('+pct+'%)';
}
restart();
</script>
</body>
</html>
